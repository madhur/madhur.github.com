baseURL = "https://madhur.co.in/"
languageCode = "en-us"
title = "Coding it my way"
theme = "PaperMod"

[pagination]
  pagerSize = 15

enableRobotsTXT = true
googleAnalytics = "G-N14VDHYFHQ"

[services.googleAnalytics]
  ID = "G-N14VDHYFHQ"

[params]
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  comments = true
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "Hi, I'm Madhur 👋"
    Content = "A software developer who likes building things and writing about technology."

  [[params.socialIcons]]
    name = "linkedin"
    url = "http://www.linkedin.com/in/madhurahuja"

  [[params.socialIcons]]
    name = "stackoverflow"
    url = "http://stackoverflow.com/users/507256/madhur-ahuja"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/madhur"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:ahuja.madhur@gmail.com"

  [params.assets]
    disableHLJS = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
