<script>
(function () {
  // Flying tricolor planes doodle from the old Jekyll site, shown only on
  // Indian Republic Day (Jan 26) and Independence Day (Aug 15).
  var today = new Date();
  var dd = today.getDate();
  var mm = today.getMonth() + 1;
  if ((mm === 1 && dd === 26) || (mm === 8 && dd === 15)) {
    var s = document.createElement("script");
    s.src = "/js/planes.js";
    s.onload = function () {
      doodle.init("/images/plane.png");
    };
    document.body.appendChild(s);
  }
})();
</script>
