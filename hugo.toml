baseURL = "https://madhur.co.in/"
languageCode = "en-us"
title = "Coding it my way"
theme = "PaperMod"

[pagination]
  pagerSize = 15

enableRobotsTXT = true

# Preserve the Jekyll permalink scheme (/blog/:year/:month/:day/:title.html) so
# 15 years of indexed/external links keep resolving. The `.html` suffix comes
# from uglyURLs scoped to the posts section.
[permalinks]
  posts = "/blog/:year/:month/:day/:slug"

[uglyURLs]
  posts = true

[params]
  googleAnalytics = "G-N14VDHYFHQ"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  comments = true
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "Hi, I'm Madhur 👋"
    Content = "A software developer who likes building things and writing about technology."

  [[params.socialIcons]]
    name = "linkedin"
    url = "http://www.linkedin.com/in/madhurahuja"

  [[params.socialIcons]]
    name = "stackoverflow"
    url = "http://stackoverflow.com/users/507256/madhur-ahuja"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/madhur"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:ahuja.madhur@gmail.com"

  [params.assets]
    disableHLJS = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON", "Robots"]

[outputFormats.Robots]
  name = "Robots"
  mediaType = "text/plain"
  baseName = "robots"
  isPlainText = true
  notAlternative = true

[params.giscus]
  repo = "madhur/madhur.github.com"
  repoId = "REPLACE_WITH_REPO_ID_FROM_GISCUS_APP"
  category = "Comments"
  categoryId = "REPLACE_WITH_CATEGORY_ID_FROM_GISCUS_APP"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "dark"
  lang = "en"
