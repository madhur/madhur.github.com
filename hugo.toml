baseURL = "https://madhur.co.in/"
locale = "en-us"
title = "Madhur Ahuja"
theme = "PaperMod"

[pagination]
  pagerSize = 15

# Preserve the Jekyll permalink scheme (/blog/:year/:month/:day/:title.html) so
# 15 years of indexed/external links keep resolving. The `.html` suffix comes
# from uglyURLs scoped to the posts section.
[permalinks]
  posts = "/blog/:year/:month/:day/:slug"

[uglyURLs]
  posts = true

# Mirrors the old Jekyll site's nav (Home / Blog / Work / About / Contact),
# plus the tag cloud so it's reachable. The archive isn't a nav item: it's
# linked from below the blog listing instead (see layouts/list.html), since
# it's a view onto the same posts, not its own section. Search isn't a nav
# item either: it's a live search box built directly into the nav (see
# layouts/partials/header.html + static/js/nav-search.js) rather than a link
# out to its own page. /search/ (content/search.md) still builds as a
# fallback/deep-linkable page, just isn't linked from the nav anymore.
[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 5

[[menu.main]]
  identifier = "blog"
  name = "Blog"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "projects"
  name = "Work"
  url = "/projects/"
  weight = 40

[[menu.main]]
  identifier = "info"
  name = "About"
  url = "/info/"
  weight = 50


[params]
  googleAnalytics = "G-N14VDHYFHQ"
  defaultTheme = "dark"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  comments = true
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "Hi, I'm Madhur"
    Content = """
A software developer who likes building things and writing about technology.

You can browse my [projects on GitHub](https://github.com/madhur?tab=repositories).

I also run a small [homelab](https://github.com/madhur/docker-compose-homelab) — the docker-compose configs behind it are public too.

You can also reach me on any of the channels below.
"""

  [[params.socialIcons]]
    name = "linkedin"
    url = "http://www.linkedin.com/in/madhurahuja"

  [[params.socialIcons]]
    name = "stackoverflow"
    url = "http://stackoverflow.com/users/507256/madhur-ahuja"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/madhur"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:ahuja.madhur@gmail.com"

  [params.assets]
    disableHLJS = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON", "Robots"]

[outputFormats.Robots]
  name = "Robots"
  mediaType = "text/plain"
  baseName = "robots"
  isPlainText = true
  notAlternative = true

[params.giscus]
  repo = "madhur/madhur.github.com"
  repoId = "MDEwOlJlcG9zaXRvcnkxMTk4NzY4"
  category = "General"
  categoryId = "DIC_kwDOABJKsM4DDaIW"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "dark"
  lang = "en"
